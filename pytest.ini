# ==============================================================================
# pytest.ini — pytest configuration.
# ==============================================================================
[pytest]
# Where pytest looks for tests.
testpaths = tests

# asyncio_mode = auto: pytest-asyncio will run any "async def test_..." function
# as a coroutine WITHOUT us having to decorate each one with
# @pytest.mark.asyncio. Since our whole app is async, every test is async, so
# "auto" removes a lot of boilerplate. (The alternative, "strict", requires the
# marker on each async test.)
asyncio_mode = auto

# Give async fixtures a fresh event loop per test function by default. "function"
# scope keeps tests isolated: no shared loop state leaking between them.
asyncio_default_fixture_loop_scope = function

# Nicer output: show the reason for skips/xfails, and print a short summary.
addopts = -ra -q
