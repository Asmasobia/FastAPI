# ==============================================================================
# 50-hpa.yaml — HorizontalPodAutoscaler for the application.
#
# WHAT THIS CHANGES ABOUT THE SYSTEM
#   Up to now the replica count was a number a human typed. From here it is a
#   number a controller derives from measurement, once every 15 seconds, forever.
#   That is a genuine change in ownership, and it has three consequences that are
#   easy to miss:
#
#     1. `replicas` MUST COME OUT of 40-deployment.yaml, or two controllers fight
#        over one field. It has been commented out there, with the reasoning.
#     2. The availability floor moves HERE, into `minReplicas`. This object is now
#        the answer to "how many replicas does this service run?"
#     3. Pods are now terminated routinely, not just on deploys. Graceful
#        shutdown (Module 09) stops being a nicety.
#
# ⚠️ REQUIRES metrics-server. Without it this object is created successfully,
#    reports `TARGETS: <unknown>/70%`, and does nothing at all — silently, with no
#    alarming event. One-command check:
#
#      kubectl top pods -n tasks-api
#
#    If that fails, the HPA cannot work. Rancher Desktop's k3s bundles
#    metrics-server; kind and minikube usually need it installed, sometimes with
#    `--kubelet-insecure-tls`.
#
# APPLY (immediately after 40-deployment.yaml, since that now starts at 1 replica)
#   kubectl apply -f k8s/50-hpa.yaml
#   kubectl get hpa -n tasks-api -w
#
# VERIFY IT ACTUALLY SCALES
#   # In one terminal:
#   kubectl get hpa tasks-api -n tasks-api -w
#
#   # In another — hit an endpoint that does real work, from inside the cluster:
#   kubectl run hpa-load -n tasks-api --image=busybox:1.36 --restart=Never -- \
#     sh -c 'while true; do wget -q -O /dev/null http://tasks-api:8000/health; done'
#
#   # Then read the controller's own account of its decisions:
#   kubectl describe hpa tasks-api -n tasks-api      # the Events, at the bottom
#
#   kubectl delete pod hpa-load -n tasks-api
#
#   ⚠️ /health is a trivial endpoint, so one busybox loop may not move CPU much.
#      That is itself the lesson from Module 07 — health endpoints are cheap on
#      purpose. To generate real load, hit an authenticated endpoint that touches
#      the database, or several loadgen Pods at once.
#
# ⚠️ AND THE RATE LIMITER: this object is the reason the rate limiter must be
#    backed by Redis (RATE_LIMIT_STORAGE_URI in 10-configmap.yaml) rather than
#    per-process memory. With a fixed 3 replicas, in-memory counters gave users
#    roughly 3x their documented limit. With an HPA, the multiplier is now a
#    number that CHANGES WITH LOAD — so a documented "100 requests/minute" means
#    300 at 3 replicas and 600 at 6, and it moves during a traffic spike, which is
#    exactly when the limit is supposed to be protecting you. Autoscaling turns a
#    known inaccuracy into an unpredictable one. Verify the shared counter with
#    the X-RateLimit-Remaining check in k8s/README.md.
# ==============================================================================

apiVersion: autoscaling/v2
# ⚠️ v2, NOT v1. autoscaling/v1 supports exactly one CPU target and has no
#    `behavior:` block, so you cannot tune stabilisation or rate limits at all.
#    It still appears in most blog posts. v2 has been GA since Kubernetes 1.23.
kind: HorizontalPodAutoscaler
metadata:
  name: tasks-api
  namespace: tasks-api
  labels:
    app: tasks-api
spec:
  # ---- what to scale --------------------------------------------------------
  # A reference by NAME, resolved at runtime. Nothing validates it on apply — a
  # typo here produces a healthy-looking HPA that reports `FailedGetScale` in its
  # events and never scales anything.
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: tasks-api

  # ---- the floor ------------------------------------------------------------
  # This is where the "why 3 replicas" reasoning from 40-deployment.yaml now
  # lives, unchanged:
  #
  #   1 = no availability; any restart, drain, or rollout is downtime.
  #   2 = survives one failure, but a rollout momentarily leaves you at 1.
  #   3 = can lose one AND be mid-rollout and still have capacity. Also the
  #       minimum at which a PodDisruptionBudget with minAvailable: 2 is
  #       satisfiable (Module 11) — that interaction is a real constraint, not
  #       trivia: an unsatisfiable PDB blocks node drains indefinitely.
  #
  # ⚠️ minReplicas is a FLOOR, not a target. The HPA will never go below it even
  #    at 0% CPU, which is correct: availability is not a function of load.
  minReplicas: 3

  # ---- the ceiling, which is the field that deserves the most thought -------
  #
  # ⚠️ 6 IS NOT AN ARBITRARY ROUND NUMBER. IT IS DERIVED FROM THE DATABASE.
  #
  #    SQLAlchemy's default async pool is pool_size=5 + max_overflow=10, i.e. up
  #    to 15 connections per process. src/db.py does not override it. uvicorn
  #    runs one worker per Pod. So:
  #
  #        replicas x 15 connections  <=  Postgres max_connections (default 100)
  #        6 x 15 = 90                                                    ✓
  #        10 x 15 = 150                                                  ✗
  #
  #    At 10 replicas under load, the app exhausts Postgres' connection slots and
  #    every replica starts failing with "FATAL: sorry, too many clients
  #    already". THE AUTOSCALER TAKES DOWN THE DATABASE IT IS TRYING TO SERVE,
  #    and the failure surfaces in the application, so the app looks like the
  #    victim rather than the cause.
  #
  #    THE GENERAL PRINCIPLE, which is the most valuable sentence in this file:
  #    THE THING YOU SCALE INTO HAS LIMITS TOO, AND KUBERNETES KNOWS NOTHING
  #    ABOUT THEM. Before raising maxReplicas, multiply it by every per-replica
  #    resource your Pods consume from a shared, finite system — database
  #    connections, third-party API rate limits, licence seats, message-broker
  #    consumer slots, NAT gateway ports — and check the product against that
  #    system's ceiling. Autoscaling moves the bottleneck; it does not remove it.
  #
  #    RAISING THIS PROPERLY means fixing the constraint first, not the number:
  #    add PgBouncer (transaction pooling collapses hundreds of client
  #    connections onto a few dozen server ones), or set an explicit small
  #    pool_size per Pod, or raise max_connections with the memory to back it.
  #
  #    ⚠️ SECOND CEILING, on a single-node cluster: 6 x 100m CPU + 6 x 128Mi is
  #       600m and 768Mi of REQUESTS, plus Postgres and Redis, and it must fit in
  #       the node's allocatable (Module 08). Exceed it and the extra Pods sit
  #       Pending forever — the HPA cannot tell, because adding nodes is the
  #       Cluster Autoscaler's job and there isn't one here.
  maxReplicas: 6

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          # ⚠️ 70% OF THE **REQUEST**. Not of the limit, not of the node. This is
          #    the fact that makes autoscaling confusing, so spell it out for this
          #    specific Deployment, using the numbers from 40-deployment.yaml:
          #
          #        cpu request = 100m,  cpu limit = 1000m
          #        scale-out threshold = 70% of 100m = 70m per Pod
          #
          #    So the HPA adds replicas when each Pod averages 70 millicores —
          #    which is SEVEN PERCENT of what the container is actually permitted
          #    to use. That is a real consequence of a 10x gap between request and
          #    limit, and it is worth naming rather than discovering:
          #
          #      * Upside: very eager scale-out, so latency stays flat. Safe.
          #      * Downside: you run more, smaller Pods than necessary, each with
          #        its own memory baseline and its own database connections — and
          #        the connection arithmetic above is exactly what that costs.
          #
          #    THE HONEST FIX IS NOT IN THIS FILE. It is to make the request
          #    reflect measured steady-state usage (Module 08's sizing procedure).
          #    A request set by guess makes the HPA scale by guess, and no amount
          #    of tuning this percentage repairs that. It is left at 100m here
          #    because this project has no load history to size from — and saying
          #    that is stronger than pretending the number was measured.
          #
          #    WHY 70 AND NOT 90: the target is where you SIT, not where you tip
          #    over. Between crossing the threshold and a new Pod serving traffic
          #    there is HPA evaluation (up to 15s) + scheduling + image pull +
          #    container start + migrations-free boot + readiness probe passing —
          #    tens of seconds at best. That entire window is served by the
          #    existing Pods. At a 90% target they are saturated before help
          #    arrives. 50-70% is the usual defensible band; 70 leans efficient
          #    because this app's startup is fast.
          averageUtilization: 70

    # ---- ⚠️ WHY THERE IS NO MEMORY METRIC HERE -------------------------------
    #
    #    You can autoscale on memory, and it is almost always wrong for a service
    #    like this one, for a reason that has nothing to do with Kubernetes:
    #
    #      MEMORY DOES NOT COME BACK DOWN. Python (like the JVM and Node) returns
    #      very little memory to the OS after a spike. A process that peaked at
    #      400Mi keeps reporting ~400Mi while completely idle. So a memory-based
    #      HPA scales OUT during the spike and then NEVER SCALES BACK IN, because
    #      the metric it watches stays high forever. You have built a ratchet, and
    #      it looks like a memory leak in your autoscaler.
    #
    #      Worse: memory usage here is dominated by connection pools and caches,
    #      which grow with the number of replicas. Scaling out to reduce
    #      per-replica memory can increase total memory.
    #
    #    High memory means "give this Pod a bigger limit" (vertical), not "give me
    #    more Pods" (horizontal). Diagnose it with Module 08's tools; do not
    #    autoscale on it.
    #
    #    ⚠️ AND IF YOU DO ADD A SECOND METRIC, know the rule: the HPA computes a
    #       desired replica count for EACH metric and takes the MAXIMUM. Any one
    #       metric can scale you up; ALL of them must agree before you scale down.
    #       So a sticky metric like memory does not merely add a signal — it
    #       becomes a floor that suppresses every scale-down decision.

  # ---- behavior: the difference between autoscaling and thrashing -----------
  # Every value below is at or near the Kubernetes default. It is written out
  # explicitly because these are the fields you will reach for when someone
  # reports "it's flapping" or "it won't scale down", and an undocumented default
  # is a field nobody knows exists.
  behavior:
    scaleUp:
      # React to the newest reading immediately. Slow scale-up is user-visible
      # errors; slightly eager scale-up costs a few Pods for a few minutes. The
      # asymmetry in cost justifies the asymmetry in configuration.
      stabilizationWindowSeconds: 0
      policies:
        # Percent doubles the fleet every 15s — powerful at 20 replicas, useless
        # at 1 (100% of 1 is 1 more). The Pods policy covers the small-fleet case.
        # `selectPolicy: Max` picks whichever allows MORE growth, so the two
        # policies together behave sensibly at every scale. This is why both
        # exist as defaults.
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 2
          periodSeconds: 15
      selectPolicy: Max
    scaleDown:
      # ⚠️ THE ANSWER TO "WHY ISN'T IT SCALING DOWN?" — it is, in a few minutes.
      #    The HPA takes the MAXIMUM recommendation across this whole window, so
      #    one busy 15-second interval holds the replica count up for the next
      #    five minutes. That is deliberate: removing capacity from a service that
      #    might get busy again is how a scale-down becomes an incident, and a
      #    service that oscillates has worse latency than one that is simply
      #    over-provisioned.
      #
      #    Kept at the 300s default. Shorten it only with a specific reason and a
      #    graceful-shutdown path you trust, since every scale-down terminates
      #    Pods holding real requests.
      stabilizationWindowSeconds: 300
      policies:
        # Never shed more than one Pod per minute. At minReplicas: 3 and
        # maxReplicas: 6 this means a full scale-in takes ~3 minutes — gentle,
        # and cheap insurance against a metrics blip emptying the fleet.
        - type: Pods
          value: 1
          periodSeconds: 60
      selectPolicy: Min
