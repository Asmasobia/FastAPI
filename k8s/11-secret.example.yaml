# ==============================================================================
# 11-secret.example.yaml — TEMPLATE for the application's Secret.
#
# ┌──────────────────────────────────────────────────────────────────────────┐
# │  THIS FILE IS A TEMPLATE. IT IS COMMITTED TO GIT.                        │
# │  THE FILE YOU CREATE FROM IT IS NOT.                                     │
# └──────────────────────────────────────────────────────────────────────────┘
#
# WHY A TEMPLATE AT ALL:
#   Same reasoning as .env.example in the repo root. Anyone cloning this repo
#   needs to know WHICH secret keys the app expects — otherwise the Deployment
#   starts, fails to find JWT_SECRET_KEY, and they have to read the source to
#   find out why. So we commit the SHAPE with placeholder values, and never the
#   real values.
#
#   .gitignore enforces this: `*secret*.yaml` is ignored, with an exception for
#   `*secret*.example.yaml`. So if you copy this to `11-secret.yaml` and fill in
#   real values, git will refuse to see it. That's deliberate.
#
# ------------------------------------------------------------------------------
# THE MOST IMPORTANT THING ON THIS PAGE
# ------------------------------------------------------------------------------
#   A Kubernetes Secret is NOT ENCRYPTED. The values are base64-ENCODED.
#
#   base64 is an encoding, not a cipher. There is no key. Reversing it is one
#   command that anyone can run:
#
#       echo 'c3VwZXItc2VjcmV0LXZhbHVl' | base64 -d
#       -> super-secret-value
#
#   So a Secret committed to git is precisely as compromised as a plaintext
#   password in git — and arguably worse, because base64 LOOKS scrambled, so
#   people assume it's protected and don't rotate the credential. And it stays
#   in git history forever after you "fix" it by deleting the file.
#
#   So what DOES a Secret give you over a ConfigMap?
#     1. Separate RBAC. You can grant read on ConfigMaps while denying it on
#        Secrets. That's a real, useful boundary.
#     2. Encryption at rest in etcd — but ONLY if the cluster operator enabled
#        an EncryptionConfiguration. It is off by default. Don't assume it.
#     3. Never written unencrypted to node disk (mounted as tmpfs, in memory).
#     4. Values are omitted from most `kubectl describe` output and logs.
#
#   What it does NOT give you: secrecy from anyone with cluster read access,
#   or from anyone reading your git history.
#
#   For production the answer is to keep secrets OUT of the cluster's git
#   entirely — External Secrets Operator pulling from Vault / AWS Secrets
#   Manager / Azure Key Vault, or Sealed Secrets (which are asymmetrically
#   encrypted and therefore genuinely safe to commit).
# ==============================================================================

apiVersion: v1
kind: Secret

metadata:
  # The name the Deployment will reference via envFrom.secretRef.name.
  # Convention: <app>-secrets, matching <app>-config for the ConfigMap.
  name: tasks-api-secrets

  # Secrets are NAMESPACED. A Pod can only mount a Secret that lives in its own
  # namespace — there is no cross-namespace reference. If you deploy the app to
  # a different namespace, this Secret has to be created there too. This is a
  # common first-time confusion: "the Secret exists!" — yes, in the wrong place.
  namespace: tasks-api

  labels:
    app: tasks-api
    # Marks this as part of the app rather than infrastructure. Lets you do
    # `kubectl get secret -l app=tasks-api` and, later, lets Kustomize and Helm
    # select consistently.

# `Opaque` is the default type: arbitrary user-defined key/value pairs.
# Other types exist and are NOT interchangeable — Kubernetes validates their
# required keys:
#   kubernetes.io/dockerconfigjson  — registry pull credentials
#   kubernetes.io/tls               — must contain tls.crt and tls.key
#   kubernetes.io/service-account-token
#   kubernetes.io/basic-auth        — must contain username and password
# Use Opaque unless a controller specifically requires one of the others.
type: Opaque

# ------------------------------------------------------------------------------
# `stringData` vs `data` — a deliberate choice, not an accident
# ------------------------------------------------------------------------------
#   data:        values MUST be base64-encoded by you.
#   stringData:  values are plain text; the API server base64-encodes them on
#                write. Write-only — read the Secret back and you'll see `data`.
#
# We use `stringData` here for two reasons:
#   1. Readability. A template full of base64 blobs teaches nobody anything,
#      and a typo in base64 produces a confusing runtime failure rather than
#      an obvious one.
#   2. Honesty. Hand-encoding to base64 encourages the false belief that you've
#      protected something. Writing the value in plaintext makes it obvious that
#      this file must never be committed with real values in it.
#
# If both `data` and `stringData` set the same key, `stringData` wins.
# ------------------------------------------------------------------------------
stringData:

  # ── JWT signing key ────────────────────────────────────────────────────────
  # Read by src/config.py as Settings.jwt_secret_key (pydantic-settings maps
  # env var names case-insensitively, so JWT_SECRET_KEY fills jwt_secret_key).
  #
  # WHY THIS IS THE MOST SENSITIVE VALUE HERE:
  #   The app signs JWTs with HS256 — symmetric, so the same key signs AND
  #   verifies. Anyone who learns this key can forge a token for any user,
  #   including one that never existed. There is no revocation; tokens are
  #   valid until they expire. Leaking this is a full authentication bypass.
  #
  # GENERATE A REAL ONE — never reuse this placeholder, and never reuse the
  # value from your local .env:
  #   python -c "import secrets; print(secrets.token_hex(32))"
  #
  # 32 bytes of entropy (64 hex chars) comfortably exceeds HMAC-SHA256's block
  # requirements. Longer buys nothing; shorter is a real weakness.
  #
  # ROTATION NOTE: changing this key invalidates every issued token at once,
  # logging everybody out. That's the correct response to a suspected leak, but
  # it means rotation is user-visible — worth knowing before you need to do it
  # at 3am. Supporting graceful rotation needs a key-ID scheme, which is beyond
  # this app's scope and worth saying so rather than pretending otherwise.
  JWT_SECRET_KEY: "REPLACE_ME_WITH_python_-c_import_secrets_print_secrets_token_hex_32"

  # ── Database connection string ─────────────────────────────────────────────
  # Read as Settings.database_url.
  #
  # WHY THE WHOLE URL IS IN THE SECRET, rather than splitting host/port/dbname
  # into the ConfigMap and only the password in here:
  #
  #   The app's configuration contract is a single DSN string — that's what
  #   pydantic-settings reads and what SQLAlchemy consumes. Splitting it would
  #   mean either (a) changing the app to assemble a URL from parts, or (b)
  #   assembling it in the manifest with shell interpolation in the container
  #   command. Option (a) is app churn driven purely by deployment mechanics;
  #   option (b) puts logic in YAML, which is the worst place for logic.
  #
  #   The cost of keeping it whole: the hostname and database name — which are
  #   not sensitive — end up behind Secret-level RBAC, so someone who can read
  #   ConfigMaps but not Secrets can't see where the database lives. That's a
  #   minor inconvenience, not a security problem, and it's the cheaper trade.
  #
  #   REVISIT IF: you adopt External Secrets Operator, which can compose a URL
  #   from separately-managed parts. Then splitting becomes free and worth doing.
  #
  # The hostname `postgres` is a Kubernetes Service name. In-cluster DNS
  # (CoreDNS) resolves it — the fully-qualified form is
  # postgres.tasks-api.svc.cluster.local, but the short name works because a
  # Pod's resolv.conf search path includes its own namespace.
  #
  # `+asyncpg` selects the ASYNC PostgreSQL driver. This matters: the app's
  # endpoints are `async def`, and a synchronous driver would block the event
  # loop under load. Getting this wrong doesn't error — it just silently
  # destroys concurrency.
  DATABASE_URL: "postgresql+asyncpg://tasks:REPLACE_ME_DB_PASSWORD@postgres:5432/tasks"

  # ── PostgreSQL's own password ─────────────────────────────────────────────
  # Consumed by the postgres StatefulSet (20-postgres.yaml) as POSTGRES_PASSWORD,
  # which the official postgres image uses to initialise the superuser on first
  # boot of an empty data directory.
  #
  # ⚠️ COUPLING WORTH KNOWING ABOUT:
  #   This MUST equal the password embedded in DATABASE_URL above. They are two
  #   representations of one fact, and nothing validates that they agree. If they
  #   drift, Postgres starts perfectly healthily and the app fails authentication
  #   — so the symptom appears in the app while the bug is in the database
  #   config. Expect to lose twenty minutes to this at least once.
  #
  #   The duplication exists because the postgres image wants a bare password
  #   and the app wants a DSN. Eliminating it needs either an init container
  #   that assembles the URL, or a secrets manager that templates both from one
  #   source. Both are out of scope here; the honest fix is to note the coupling
  #   loudly, which is what this comment is for.
  #
  # ⚠️ ALSO: POSTGRES_PASSWORD only takes effect when initialising an EMPTY data
  #   directory. Changing it later does nothing to an existing volume — you must
  #   ALTER the role, or delete the PVC and start over.
  POSTGRES_PASSWORD: "REPLACE_ME_DB_PASSWORD"

# ==============================================================================
# NOT IN THIS FILE, ON PURPOSE
# ==============================================================================
#   These live in 10-configmap.yaml because they aren't secret, and putting
#   non-secrets in a Secret makes RBAC less useful and reviews harder:
#
#     APP_NAME, APP_VERSION, ENVIRONMENT   — metadata
#     DB_ECHO                              — a logging toggle
#     JWT_ALGORITHM                        — "HS256" is public information;
#                                            the algorithm is not the secret,
#                                            the key is
#     ACCESS_TOKEN_EXPIRE_MINUTES          — a policy value
#     REDIS_URL                            — no credential in this deployment.
#                                            If Redis gains a password, the URL
#                                            moves here.
#     CACHE_ENABLED, RATE_LIMIT            — feature and policy switches
#
#   The test: would leaking this value harm anyone? If no, it's config.
# ==============================================================================

# ==============================================================================
# HOW TO ACTUALLY CREATE THE REAL SECRET — three options, worst to best
# ==============================================================================
#
# ── OPTION 1: copy this file and fill it in ────────────────────────────────
#   cp k8s/11-secret.example.yaml k8s/11-secret.yaml
#   # edit k8s/11-secret.yaml, then:
#   kubectl apply -f k8s/11-secret.yaml
#
#   .gitignore already prevents committing 11-secret.yaml. Verify that it's
#   actually working before you trust it:
#       git check-ignore -v k8s/11-secret.yaml
#   That should print the matching .gitignore rule. Silence means NOT ignored —
#   stop and fix it.
#
#   Downside: a plaintext credential sits on your disk indefinitely.
#
# ── OPTION 2: create it imperatively, no file on disk ─────────────────────
#   DB_PASS="$(python -c 'import secrets; print(secrets.token_urlsafe(24))')"
#   JWT_KEY="$(python -c 'import secrets; print(secrets.token_hex(32))')"
#
#   kubectl create secret generic tasks-api-secrets \
#     --namespace tasks-api \
#     --from-literal=JWT_SECRET_KEY="$JWT_KEY" \
#     --from-literal=POSTGRES_PASSWORD="$DB_PASS" \
#     --from-literal=DATABASE_URL="postgresql+asyncpg://tasks:${DB_PASS}@postgres:5432/tasks"
#
#   Better: nothing persists to disk, and the two passwords cannot drift because
#   both are derived from one shell variable.
#
#   ⚠️ Caveats worth knowing: the values land in your shell history, and are
#   briefly visible in the process list to other users on the machine. On a
#   shared host, prefer --from-file. This is also imperative, which contradicts
#   the declarative model — acceptable for secrets specifically, because the
#   whole point is that the value must not live in the declarative source.
#
# ── OPTION 3: don't keep secrets in the cluster's git at all ───────────────
#   The production answer, and the one to describe in an interview:
#
#     • External Secrets Operator — a controller that reads from Vault, AWS
#       Secrets Manager, Azure Key Vault, or GCP Secret Manager and creates the
#       Kubernetes Secret for you. What you commit is an ExternalSecret object
#       naming WHERE the value lives, never the value. Rotation happens in the
#       secret store and syncs automatically.
#
#     • Sealed Secrets — you encrypt with a public key whose private half only
#       the in-cluster controller holds. The encrypted SealedSecret is genuinely
#       safe to commit, which makes it GitOps-compatible. Simpler than ESO, but
#       rotation is manual and it's cluster-bound.
#
#   Both are beyond this module. Knowing WHY they exist — that a plain Secret
#   is base64 and therefore unsafe in git — is the part that matters, and it's
#   the part interviews ask about.
#
# ==============================================================================
# VERIFYING, AND ONE GOTCHA THAT WILL CATCH YOU
# ==============================================================================
#   # Confirm it exists and see which keys it holds (values are NOT shown):
#   kubectl get secret tasks-api-secrets -n tasks-api
#   kubectl describe secret tasks-api-secrets -n tasks-api
#
#   # Read one value back — note how trivially base64 reverses:
#   kubectl get secret tasks-api-secrets -n tasks-api \
#     -o jsonpath='{.data.JWT_SECRET_KEY}' | base64 -d
#
#   ⚠️ THE GOTCHA: updating a Secret does NOT restart the Pods using it.
#
#   Secrets consumed as ENVIRONMENT VARIABLES are read once, at container start.
#   Change the Secret and the running Pods keep the old value indefinitely —
#   with no warning, no event, and nothing in the logs. You must trigger a
#   rollout yourself:
#
#       kubectl rollout restart deployment/tasks-api -n tasks-api
#
#   (Secrets mounted as FILES do update in place, within about a minute — but
#   not when mounted with subPath, and your app has to re-read the file. Env
#   vars are simpler, so we use env vars and accept the manual restart.)
#
#   This is why tooling like Reloader exists, and why Helm charts commonly add a
#   checksum annotation of the Secret to the Pod template — changing the Secret
#   changes the annotation, which changes the template, which triggers a rollout
#   automatically. Worth mentioning if you're asked how to handle config changes.
# ==============================================================================
